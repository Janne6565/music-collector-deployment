# Non-secret backend config. Environment-specific values (public base URL) are patched
# in the overlay; secrets live in the sealed secrets instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: music-collector-backend-config
data:
  # Cap the JVM heap — the cluster runs on a single memory-scarce node.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MC_DB_URL: jdbc:postgresql://postgres:5432/musiccollector
  # The shared cluster MinIO, rather than a StatefulSet per environment: photos are the
  # only object storage this app needs, and two more stateful workloads on a single node
  # is a poor trade for the isolation. The credentials are scoped to this bucket alone.
  MC_MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000
  MC_DB_USER: musiccollector
  LOGGING_LEVEL_COM_REKORDO: INFO
  # MusicBrainz requires a descriptive, contactable User-Agent. Anonymous callers hit this
  # proxy, so identify the deployment rather than the end user.
  MC_MUSICBRAINZ_USER_AGENT: "Rekordo/0.1 (https://github.com/Janne6565/rekordo-backend)"
  # --- Telemetry (SigNoz) -------------------------------------------------------------
  # One agent, one pipeline. The OpenTelemetry Java agent produces the traces and, through
  # its Micrometer bridge, also carries the meters the app registers -- http.server.requests,
  # the JVM binders, and the rekordo.* collection gauges -- so they keep the names the other
  # Spring services here already publish under.
  #
  # Micrometer's own OTLP registry is deliberately not used. It cannot be combined with this:
  # turning the agent's metric exporter off to avoid duplication also silences the Micrometer
  # registry, because Boot's OpenTelemetry module reads the same OTEL_METRICS_EXPORTER. One
  # or the other, and the agent is the one already required for traces.
  OTEL_SERVICE_NAME: rekordo-backend
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
  # The agent's own JVM metrics would otherwise land beside Micrometer's under the very same
  # names -- jvm.memory.used twice, from two sources, with different attributes.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "false"
  # The agent defaults to http/protobuf, so the protocol has to be said out loud or it
  # speaks HTTP at the gRPC port: the collector resets the connection, the agent logs a
  # failed export every few seconds, and nothing arrives. It warns about the port at
  # startup and then carries on, so nothing looks broken from the outside.
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector.observability.svc.cluster.local:4317
  # A single node with one replica: sampling would only make a quiet service harder to
  # debug, and the whole traffic of this app is a rounding error next to the k8s metrics.
  OTEL_TRACES_SAMPLER: always_on
