apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-collector-staging
resources:
- ../../base
- ingress.yaml
- sealed-secrets
# CI (music-collector-backend / -frontend) rewrites these tags via
# `kustomize edit set image` and pushes — ArgoCD then auto-syncs.
# Merging to main in a product repo IS the staging deploy.
# The values below are the bootstrap pins.
# Per-environment bucket, so staging can never write into the prod one.
configMapGenerator:
  - name: music-collector-backend-config
    behavior: merge
    literals:
      - MC_MINIO_BUCKET=music-collector-photos-staging

generatorOptions:
  # The deployment references the config map by its plain name.
  disableNameSuffixHash: true

images:
- name: ghcr.io/janne6565/music-collector-backend
  newTag: main-eb74881
- name: ghcr.io/janne6565/music-collector-frontend
  newTag: main-cc4e66d
